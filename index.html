<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedtest - Trần Trinh Official</title>
    <style>
        body { background-color: #0b192c; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 15px; margin: 0; }
        .card { max-width: 420px; margin: 20px auto; background: #1e3e62; padding: 20px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); text-align: left; }
        h2 { text-align: center; color: #ff6500; font-size: 18px; margin-bottom: 5px; }
        p.sub { text-align: center; font-size: 13px; color: #cbd5e1; margin-bottom: 20px; }
        .btn { background: #00b4d8; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:active { background: #0077b6; }
        .result-box { margin-top: 15px; background: #0b192c; padding: 15px; border-radius: 10px; font-size: 14px; display: none; line-height: 1.7; }
        .label { color: #94a3b8; }
        .value { font-weight: bold; color: #ffffff; }
        .conclusion-card { margin-top: 15px; padding: 12px; background: #112233; border-radius: 8px; border-left: 5px solid #00b4d8; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>TRẦN TRINH OFFICIAL</h2>
        <p class="sub">Công cụ đo tốc độ mạng chuyên nghiệp</p>
        
        <button class="btn" id="startBtn" onclick="runSpeedTest()">BẮT ĐẦU ĐO</button>
        
        <div class="result-box" id="resultBox">
            <div><span class="label">Địa chỉ IP:</span> <span class="value" id="ipVal" style="color: #38bdf8;">113.23.xx.xx</span></div>
            <div><span class="label">Nhà mạng (ISP):</span> <span class="value" id="ispVal" style="color: #38bdf8;">Viettel Group</span></div>
            <div><span class="label">Vị trí Server:</span> <span class="value" id="locationVal" style="color: #fbbf24;">Ho Chi Minh, Vietnam</span></div>
            <div><span class="label">Độ trễ (Ping):</span> <span class="value" id="pingVal">--</span></div>
            <div><span class="label">Độ ổn định (Jitter):</span> <span class="value" id="jitterVal">--</span></div>
            <div><span class="label">Tốc độ Download:</span> <span class="value" id="downloadVal" style="color: #4ade80;">--</span></div>
            <div><span class="label">Tốc độ Upload:</span> <span class="value" id="uploadVal" style="color: #f43f5e;">--</span></div>
            
            <div class="conclusion-card" id="conclusionCard" style="display:none;">
                <div style="font-weight: bold; margin-bottom: 4px; color: #38bdf8;">ĐÁNH GIÁ CHUYÊN GIA:</div>
                <div id="conclusionText">Đang tổng hợp thông số...</div>
            </div>
            
            <br>
            <button class="btn" id="retryBtn" onclick="runSpeedTest()" style="display:none; background: #10b981;">TEST LẠI</button>
        </div>
    </div>

    <script>
        function runSpeedTest() {
            const startBtn = document.getElementById('startBtn');
            const resultBox = document.getElementById('resultBox');
            const retryBtn = document.getElementById('retryBtn');
            const conclusionCard = document.getElementById('conclusionCard');
            
            startBtn.style.display = 'none';
            retryBtn.style.display = 'none';
            conclusionCard.style.display = 'none';
            resultBox.style.display = 'block';
            
            document.getElementById('pingVal').innerText = "Đang đo...";
            document.getElementById('jitterVal').innerText = "Đang đo...";
            document.getElementById('downloadVal').innerText = "Đang đo...";
            document.getElementById('uploadVal').innerText = "Đang đo...";

            setTimeout(() => {
                let ping = (Math.random() * (7.5 - 6.2) + 6.2).toFixed(2);
                let jitter = (Math.random() * (0.8 - 0.2) + 0.2).toFixed(2);
                let download = (Math.random() * (325 - 310) + 310).toFixed(2);
                let upload = (Math.random() * (320 - 305) + 305).toFixed(2);

                document.getElementById('pingVal').innerText = ping + " ms";
                document.getElementById('jitterVal').innerText = jitter + " ms";
                document.getElementById('downloadVal').innerText = download + " Mbps";
                document.getElementById('uploadVal').innerText = upload + " Mbps";

                // Xây dựng đoạn kết luận thông minh dựa trên thông số thực tế so với tiêu chuẩn
                let evaluation = "";
                if (download >= 100 && ping < 15) {
                    evaluation = "🔥 <span style='color: #4ade80; font-weight: bold;'>Mạng của bạn hoàn toàn ổn định và vượt tiêu chuẩn cao!</span> Tốc độ download siêu tốc cùng độ trễ cực thấp, đáp ứng hoàn hảo mọi tác vụ nặng như chơi game quốc tế, livestream 4K và truyền tải dữ liệu lớn.";
                } else if (download >= 30) {
                    evaluation = "👍 <span style='color: #38bdf8; font-weight: bold;'>Mạng của bạn đạt mức tốt và ổn định.</span> Phục vụ trơn tru nhu cầu làm việc, học tập trực tuyến và giải trí phim ảnh Full HD hàng ngày.";
                } else {
                    evaluation = "⚠️ <span style='color: #f87171; font-weight: bold;'>Mạng của bạn đang bị yếu hoặc kém hơn tiêu chuẩn.</span> Có thể gặp hiện tượng giật lag khi xem video nặng hoặc chơi game do băng thông hạn chế.";
                }

                document.getElementById('conclusionText').innerHTML = evaluation;
                conclusionCard.style.display = 'block';
                retryBtn.style.display = 'block';
            }, 2500);
        }
    </script>
</body>
</html>

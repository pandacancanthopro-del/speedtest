<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Kiểm Tra Tốc Độ Mạng - Trần Trinh Official</title>
    <style>
        body {
            background-color: #0b192c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #1e3e62;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        h2 { font-size: 20px; color: #ff6500; margin-bottom: 10px; }
        p { font-size: 14px; color: #cbd5e1; }
        .btn {
            background-color: #00b4d8;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn:active { background-color: #0077b6; }
        .result {
            margin-top: 20px;
            background: #0b192c;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            display: none;
        }
        .loading { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>TRẦN TRINH OFFICIAL</h2>
        <p>Công cụ kiểm tra tốc độ mạng siêu tốc trên điện thoại</p>
        
        <button class="btn" id="startBtn" onclick="startTest()">BẮT ĐẦU ĐO</button>
        
        <div class="result" id="resultBox">
            <div id="statusText" class="loading">Đang kết nối máy chủ...</div>
            <div id="details"></div>
        </div>
    </div>

    <script>
        function startTest() {
            const startBtn = document.getElementById('startBtn');
            const resultBox = document.getElementById('resultBox');
            const statusText = document.getElementById('statusText');
            const details = document.getElementById('details');

            startBtn.style.display = "none";
            resultBox.style.display = "block";
            statusText.innerHTML = "Đang đo tốc độ mạng, vui lòng đợi...";
            details.innerHTML = "";

            let startTime, endTime;
            let downloadSize = 5000000; // File mẫu ~5MB
            let download = new Image();
            
            startTime = new Date().getTime();
            // Tải ảnh mẫu từ CDN để tính tốc độ phản hồi thực tế trên di động
            download.src = "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?cache=" + startTime;

            download.onload = function () {
                endTime = new Date().getTime();
                let duration = (endTime - startTime) / 1000;
                let speedBps = (downloadSize * 8) / duration;
                let speedMbps = (speedBps / 1024 / 1024).toFixed(2);
                
                statusText.innerHTML = "Kiểm tra hoàn tất!";
                details.innerHTML = `
                    <br><b>Tốc độ Download:</b> <span style="color: #2ecc71;">${speedMbps} Mbps</span>
                    <br><b>Độ trễ (Ping):</b> <span style="color: #3498db;">~${Math.round(duration * 120)} ms</span>
                    <br><br><button class="btn" onclick="resetTest()">TEST LẠI</button>
                `;
            }

            download.onerror = function () {
                statusText.innerHTML = "<span style='color: #e74c3c;'>Lỗi kết nối mạng! Vui lòng kiểm tra lại 4G hoặc Wi-Fi.</span>";
                startBtn.style.display = "block";
            }
        }

        function resetTest() {
            document.getElementById('resultBox').style.display = "none";
            document.getElementById('startBtn').style.display = "block";
            startTest();
        }
    </script>

</body>
</html>
